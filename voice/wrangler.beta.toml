# BETA (1.4.0+) copy of the voice Worker – only the beta app (vidrichka-beta.pages.dev) may call it.
# Deploy: npx wrangler deploy -c wrangler.beta.toml
#   printenv XAI_API_KEY | npx wrangler secret put XAI_API_KEY -c wrangler.beta.toml
# Cloudflare Worker for Vidrichka voice/text logging (stateless: no D1, no KV).
# /transcribe uses Workers AI Whisper (free daily allocation); audio is never stored.
# The xAI key is NOT in this file — it is a Worker secret:
#   printenv XAI_API_KEY | wrangler secret put XAI_API_KEY
name = "vidrichka-voice-beta"
main = "src/index.js"
compatibility_date = "2026-05-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://vidrichka-beta.pages.dev"
XAI_MODEL = "grok-4.20-0309-non-reasoning"
MAX_TEXT = "500"
MAX_TOKENS = "1200"

# Workers Rate Limiting binding (free on all plans): 8 parses per minute per IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "4721"
simple = { limit = 8, period = 60 }

# Workers AI (Whisper for /transcribe), within the free 10,000 neurons a day.
[ai]
binding = "AI"

# 6 transcriptions per minute per IP.
[[ratelimits]]
name = "STT_LIMITER"
namespace_id = "4722"
simple = { limit = 6, period = 60 }

# 1.4.0: 4 screenshot reads (/vision) per minute per IP.
[[ratelimits]]
name = "VISION_LIMITER"
namespace_id = "4723"
simple = { limit = 4, period = 60 }

[observability]
enabled = true

# 1.4.0 (additive): 20 Open Food Facts searches (/off-search) per minute per IP.
[[ratelimits]]
name = "OFF_LIMITER"
namespace_id = "4724"
simple = { limit = 20, period = 60 }
